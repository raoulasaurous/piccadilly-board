<style>
  /* ------------------------------------------------------------------
     CHANGE THE STATION HERE  ->  see the CONFIG block in the script
     ------------------------------------------------------------------ */
  :root{
    --page:#1B1C1F;
    --board:#0A0B0D;
    --line:#FFFFFF;
    --dim:#8E959E;
    --dimmer:#5F6670;
    --rule:#1F4FA8;
    --dot:#2F6FD0;
    --time:#E9A23B;
    --good:#3DBF63;
    --hair:#20232A;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--page);
    color:var(--line);
    font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:min(4vw,32px);
    -webkit-font-smoothing:antialiased;
  }

  /* The board holds a fixed 16:9 landscape shape, like the framed screen it
     is copying, and every size inside it is a share of the board's own width
     (cqw). So it scales as one picture instead of reflowing. */
  .board{
    width:100%;
    max-width:1180px;
    aspect-ratio:16/9;
    container-type:size;
    background:var(--board);
    border-radius:6px;
    padding:3.1cqw 3.4cqw 2.5cqw;
    display:flex;
    flex-direction:column;
  }

  /* ---- header ---- */
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:2cqw}
  .ident{display:flex;align-items:center;gap:1.6cqw;min-width:0}
  .roundel{flex:0 0 auto;width:4.7cqw;height:auto;display:block}
  .names{min-width:0}
  .lineName{
    font-size:3.7cqw;
    font-weight:400;
    letter-spacing:.005em;
    line-height:1.05;
    margin:0;
    white-space:nowrap;
  }
  .from{margin:.25cqw 0 0;font-size:1.65cqw;font-weight:300;color:var(--dim)}
  .clockwrap{text-align:right;flex:0 0 auto}
  .clock{
    font-size:3.7cqw;
    font-weight:400;
    line-height:1.05;
    font-variant-numeric:tabular-nums;
    margin:0;
  }
  .updated{
    margin:.3cqw 0 0;
    font-size:1.1cqw;
    color:var(--dimmer);
    font-variant-numeric:tabular-nums;
  }
  .rule{height:.19cqw;min-height:2px;background:var(--rule);border-radius:1px;margin:2.1cqw 0 2cqw}

  /* ---- the two columns ---- */
  .cols{display:grid;grid-template-columns:1fr 1px 1fr;gap:3cqw;flex:1;min-height:0}
  .divider{background:var(--hair)}
  .col{min-width:0;display:flex;flex-direction:column}
  .colhead{display:flex;align-items:baseline;gap:.9cqw;margin-bottom:1.2cqw}
  .colhead .dir{font-size:1.95cqw;font-weight:600;letter-spacing:.01em;white-space:nowrap}
  .colhead .towards{font-size:1.3cqw;font-weight:300;color:var(--dim);white-space:nowrap}
  .rows{position:relative;display:flex;flex-direction:column;justify-content:flex-start;flex:1}
  /* A fixed row height, so five trains sit at a readable rhythm AND the two
     columns line up with each other even when one has fewer trains. */
  .row{position:relative;display:flex;align-items:center;gap:1.4cqw;min-width:0;flex:0 0 6.4cqw}
  /* The joining line is drawn per row, from this dot down to the next one, so
     it always stops at the last train instead of running into empty space. */
  .row:not(:last-child)::before{
    content:"";
    position:absolute;
    left:.475cqw;
    top:50%;
    height:6.4cqw;
    width:1px;
    margin-left:-.5px;
    background:var(--dot);
    opacity:.5;
  }
  .dot{
    position:relative;
    z-index:1;
    flex:0 0 auto;
    width:.95cqw;
    height:.95cqw;
    min-width:6px;
    min-height:6px;
    border-radius:50%;
    background:var(--dot);
  }
  .dest{
    flex:1;
    min-width:0;
    font-size:2cqw;
    font-weight:400;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .mins{flex:0 0 auto;font-size:2cqw;font-weight:500;color:var(--time);font-variant-numeric:tabular-nums}
  .empty{font-size:1.6cqw;color:var(--dimmer)}

  /* ---- footer ---- */
  .foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:2cqw;
    border-top:1px solid var(--hair);
    margin-top:2cqw;
    padding-top:1.5cqw;
    font-size:1.45cqw;
  }
  .status{display:flex;align-items:center;gap:.85cqw;min-width:0}
  .status .lbl{color:var(--dim);font-weight:300}
  .status .val{color:var(--good);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status .val.bad{color:var(--time)}
  .tick{flex:0 0 auto;width:1.05em;height:1.05em;display:block}
  .src{color:var(--dimmer);font-weight:300;flex:0 0 auto;display:flex;align-items:center;gap:1cqw}
  .mode{
    font-size:.82em;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--dimmer);
    border:1px solid var(--hair);
    border-radius:99px;
    padding:.2em .7em;
  }
  .mode.live{color:var(--good);border-color:rgba(61,191,99,.4)}

  /* On a phone the 16:9 shape would make the type unreadable, so below this
     width the board stops holding its proportion and stacks instead. */
  @media (max-width:700px){
    body{align-items:flex-start;padding:14px}
    .board{aspect-ratio:auto;container-type:normal;padding:22px 20px 18px;gap:0}
    .head{gap:14px}
    .roundel{width:42px}
    .lineName{font-size:26px}
    .from{font-size:14px;margin-top:2px}
    .clock{font-size:26px}
    .updated{font-size:11px;margin-top:3px}
    .rule{margin:16px 0 14px;height:2px}
    .cols{grid-template-columns:1fr;gap:18px}
    .divider{height:1px;width:100%}
    .colhead{gap:8px;margin-bottom:8px}
    .colhead .dir{font-size:16px}
    .colhead .towards{font-size:12px}
    .rows{gap:0}
    .row{gap:12px;padding:6px 0;flex:0 0 auto;height:34px}
    .row:not(:last-child)::before{left:4px;height:34px}
    .dot{width:8px;height:8px}
    .dest,.mins{font-size:15px}
    .empty{font-size:14px}
    .foot{font-size:12.5px;margin-top:16px;padding-top:12px;gap:12px}
    .status{gap:8px}
    .src{gap:10px}
  }

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="board">

  <div class="foot">

    <div class="src">
      <span class="mode" id="mode">sample data</span>
      <span>tfl.gov.uk</span>
    </div>
  </div>

</div>

<script>
// ---------------------------------------------------------------------
// CONFIG - change these three lines for a different station or line.
// Find a station id: https://api.tfl.gov.uk/StopPoint/Search/{name}?modes=tube
// ---------------------------------------------------------------------
const LINE       = "piccadilly";
const STATION_ID = "940GZZLUASL";   // Arsenal
const STATION    = "Arsenal";
const APP_KEY    = "";              // optional; free key raises the rate limit

// Which way round the two columns read. "inbound" on the Piccadilly runs
// towards Heathrow, "outbound" towards Cockfosters.
const COLUMNS = [
  { id: "A", api: "inbound",  name: "SOUTHBOUND", towards: "Heathrow" },
  { id: "B", api: "outbound", name: "NORTHBOUND", towards: "Cockfosters" }
];

const ROWS = 5;
const REFRESH_MS = 30000;

// Shown until live data arrives, and kept if the network is unavailable.
const SAMPLE = {
  inbound: [
    ["Heathrow Terminal 5", 2], ["Heathrow Terminal 4", 6], ["Heathrow Terminal 5", 11],
    ["Heathrow Terminal 4", 15], ["Heathrow Terminal 5", 20]
  ],
  outbound: [
    ["Cockfosters", 1], ["Arnos Grove", 4], ["Oakwood", 7],
    ["Southgate", 10], ["Bounds Green", 14]
  ]
};

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const hhmm = (d) => pad(d.getHours()) + ":" + pad(d.getMinutes());

function tidy(name) {
  // one tail only: stripping twice turns "Battersea Power Station Underground
  // Station" into "Battersea Power"
  return String(name || "")
    .replace(/\s+(Underground|Rail|DLR)\s+Station$/i, "")
    .replace(/\s+Station$/i, "")
    .trim();
}

function label(mins) {
  if (mins <= 0) return "due";
  return mins + " min";
}

// ---------------------------------------------------------------------
// Putting trains in columns. A port of pi/board.py's group(), split_by(),
// column_label() and dedupe(): TfL omits "direction" at every terminus and
// sends it empty on much of the DLR, the Elizabeth line and the Overground,
// so filtering on it alone left two empty columns while trains were due.
// The ladder: direction, then the platform heading, then "towards", then the
// destination; and a train the key cannot name goes with the trains to its
// destination or in its direction, else the split is refused, because a train
// under the wrong heading sends someone to the wrong platform.
// ---------------------------------------------------------------------
const COMPASS = new Set(["northbound", "southbound", "eastbound", "westbound", "inner rail", "outer rail"]);
const OPPOSITE = { Northbound: "Southbound", Southbound: "Northbound", Eastbound: "Westbound",
                   Westbound: "Eastbound", "Inner Rail": "Outer Rail", "Outer Rail": "Inner Rail" };

const titleCase = (s) => String(s).toLowerCase().replace(/(^|\s)\S/g, (c) => c.toUpperCase());

// 'Westbound - Platform 2' -> 'Westbound'. Only a real direction counts.
function heading(a) {
  const h = String(a.platformName || "").split(" - ")[0].trim();
  return COMPASS.has(h.toLowerCase()) ? titleCase(h) : "";
}

// 'Heathrow via T4 Loop' -> 'Heathrow'; TfL's "Check Front of Train" is not a place.
function tidyTowards(s) {
  s = String(s || "").split(" via ")[0].trim();
  if (s.toLowerCase() === "check front of train") return "";
  for (const tail of [" Terminal 4", " Terminal 5", " Terminals 2 & 3", " T4", " T5"]) {
    if (s.endsWith(tail)) s = s.slice(0, -tail.length);
  }
  return s;
}

// The destination, plus the branch when the branch is the fact that matters.
function rowText(a) {
  const tow = String(a.towards || "");
  const dest = tidy(a.destinationName);
  if (!dest) return tow || "?";
  if (tow.includes(" via ")) {
    const via = tow.split(" via ")[1].trim();
    const flat = dest.toLowerCase().replace(/terminal /g, "t");
    const words = via.toLowerCase().split(/\s+/).filter((w) => w !== "loop");
    if (words.length && !words.some((w) => flat.includes(w))) return dest + " via " + via;
  }
  return dest;
}

// The DLR files one prediction per platform for the same train; two trains that
// plainly go opposite ways are two trains.
function dedupe(arrivals) {
  const seen = [], out = [];
  for (const a of arrivals) {
    const k = a.destinationNaptanId || a.destinationName || "";
    const t = Math.trunc(a.timeToStation || 0);
    const h = heading(a), dirn = a.direction || "";
    const dup = seen.some(([sk, st, sh, sd]) =>
      sk === k && Math.abs(t - st) <= 5 && !(h && sh && h !== sh) && !(dirn && sd && dirn !== sd));
    if (dup) continue;
    seen.push([k, t, h, dirn]);
    out.push(a);
  }
  return out;
}

function splitBy(arrivals, key) {
  const keys = arrivals.map(key);
  const names = [...new Set(keys.filter(Boolean))].sort();   // sorted, so columns cannot swap sides
  if (names.length < 2) return null;
  const groups = Object.fromEntries(names.map((n) => [n, arrivals.filter((_, i) => keys[i] === n)]));
  const byDest = {}, byDir = {};
  for (const n of names) {
    for (const x of groups[n]) {
      const dest = tidy(x.destinationName);
      if (dest) (byDest[dest] ||= new Set()).add(n);
      if (x.direction) (byDir[x.direction] ||= new Set()).add(n);
    }
  }
  for (let i = 0; i < arrivals.length; i++) {
    if (keys[i]) continue;
    const a = arrivals[i];
    const d = byDest[tidy(a.destinationName)], r = a.direction ? byDir[a.direction] : null;
    const home = d && d.size === 1 ? d : r && r.size === 1 ? r : null;
    if (!home) return null;
    groups[[...home][0]].push(a);
  }
  for (const n of names) groups[n].sort((x, y) => (x.timeToStation ?? 1e9) - (y.timeToStation ?? 1e9));
  return names.map((n) => groups[n]);
}

function group(arrivals, columns) {
  const wanted = columns.map((c) => c.api);
  const votes = {};
  for (const a of arrivals) {
    const h = heading(a), d = a.direction;
    if (h && wanted.includes(d)) { votes[h] ||= {}; votes[h][d] = (votes[h][d] || 0) + 1; }
  }
  const headDir = {};
  for (const [h, v] of Object.entries(votes)) {
    headDir[h] = Object.entries(v).sort((x, y) => y[1] - x[1] || (x[0] < y[0] ? 1 : -1))[0][0];
  }
  const buckets = Object.fromEntries(wanted.map((d) => [d, []]));
  const homeless = [];
  for (const a of arrivals) {
    let d = a.direction;
    if (!(d in buckets)) d = headDir[heading(a)];
    (d in buckets ? buckets[d] : homeless).push(a);
  }
  if (!arrivals.length || (!homeless.length && wanted.every((d) => buckets[d].length))) {
    return columns.map((c) => [c, buckets[c.api]]);
  }
  // Every train states its direction and they all go one way: a closure, or a
  // terminus that still fills the field. One column, not a split by destination,
  // or the empty direction's column is lost; columnsFor() names it from the compass.
  if (!homeless.length) return [[null, arrivals.slice()]];
  for (const key of [heading, (a) => tidyTowards(a.towards), (a) => tidy(a.destinationName)]) {
    const parts = splitBy(arrivals, key);
    if (parts && parts.length >= 2 && parts.length <= Math.max(2, columns.length)) return parts.map((p) => [null, p]);
  }
  return [[null, arrivals.slice()]];
}

// Headings a passenger can act on, most specific first; one value for the whole column.
function columnLabel(c, mine) {
  const one = (xs) => { const s = new Set(xs.filter(Boolean)); return s.size === 1 ? [...s][0] : ""; };
  const head = one(mine.map(heading)), tow = one(mine.map((a) => tidyTowards(a.towards)));
  const dest = one(mine.map((a) => tidy(a.destinationName)));
  return [head, (c && c.name) || "", tow ? "Towards " + tow : "", dest, "Departures"].filter(Boolean).map((x) => x.toUpperCase());
}

// The two columns the page draws, from the raw arrivals.
function columnsFor(arrivals) {
  const groups = group(dedupe(arrivals), COLUMNS);
  const chains = groups.map(([c, mine]) => columnLabel(c, mine));
  const labels = chains.map((ch) => ch[0]);
  chains.forEach((ch, i) => {
    // two columns under one heading tell the reader nothing: take the next step
    if (labels.filter((l) => l === labels[i]).length > 1) {
      const next = ch.slice(ch.indexOf(labels[i]) + 1).find((x) => !labels.includes(x));
      if (next) labels[i] = next;
    }
  });
  const cols = groups.map(([c, mine], i) => {
    const tows = new Set(mine.map((a) => tidyTowards(a.towards)).filter(Boolean));
    // the trains say where they go; the config's towards is only for before they do
    let towards = (tows.size === 1 ? [...tows][0] : "") || (c && c.towards) || "";
    if (labels[i].includes("TOWARDS")) towards = "";
    return { label: labels[i], towards, rows: mine.map((a) => [rowText(a), Math.round(a.timeToStation / 60)]) };
  });
  // One direction running and the other nameable: keep its column and let it say
  // it is empty, rather than letting the running one go full width.
  if (cols.length === 1 && COLUMNS.length === 2) {
    const other = OPPOSITE[titleCase(cols[0].label)];
    if (other) cols.push({ label: other.toUpperCase(), towards: "", rows: [] });
  }
  return cols;
}

// Which of a line's statuses to show: the worst, with disruption ranked above
// "Good Service" whatever its number, and the reason trimmed to its cause.
function worstStatus(status) {
  const sts = ((status && status[0] && status[0].lineStatuses) || []).filter((s) => s.statusSeverityDescription);
  if (!sts.length) return null;
  const rank = (s) => [([10, 18].includes(s.statusSeverity) ? 1 : 0), s.statusSeverity ?? 10];
  sts.sort((a, b) => { const [x1, x2] = rank(a), [y1, y2] = rank(b); return x1 - y1 || x2 - y2; });
  return sts[0];
}

function tidyReason(reason) {
  let r = String(reason || "").trim();
  if (!r) return "";
  if (r.slice(0, 40).includes(":")) r = r.split(":").slice(1).join(":").trim();
  const m = r.match(/\b(no service|no through service|severe delays|minor delays|suspended|part suspended|closed|part closure|reduced service|replacement bus)\b/i);
  if (m && m.index) r = r.slice(m.index);
  const keep = [];
  for (const sentence of r.replace(/\n/g, " ").split(". ")) {
    const s = sentence.trim();
    if (!s) continue;
    const low = s.toLowerCase();
    if (low.includes("accepting tickets") || low.includes("valid on") || low.includes("reasonable route")) break;
    keep.push(s);
    if (keep.join(". ").length > 110) break;
  }
  let out = keep.join(". ").replace(/[ .]+$/, "");
  for (const lead of ["Severe delays ", "Minor delays ", "Delays ", "Part suspended ", "Suspended ", "Part closure ", "Part closed ", "Reduced service "]) {
    if (out.toLowerCase().startsWith(lead.toLowerCase())) { out = out.slice(lead.length); break; }
  }
  return out;
}

function paint(colId, entries, present = true) {
  const box = $(colId);
  box.textContent = "";
  if (!entries.length) {
    // an empty column is a fact about the service, so it says so; a column that
    // does not exist (one destination, no heading: one board-wide list) says nothing
    if (!present) return;
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "No trains reported";
    box.appendChild(p);
    return;
  }
  for (const [dest, mins] of entries.slice(0, ROWS)) {
    const row = document.createElement("div");
    row.className = "row";

    const dot = document.createElement("span");
    dot.className = "dot";

    const d = document.createElement("span");
    d.className = "dest";
    d.textContent = dest;

    const m = document.createElement("span");
    m.className = "mins";
    m.textContent = label(mins);

    row.append(dot, d, m);
    box.appendChild(row);
  }
}

function showSample() {
  for (const c of COLUMNS) paint("col" + c.id, SAMPLE[c.api] || []);
}

function tickClock() {
  $("clock").textContent = hhmm(new Date());
}

async function load() {
  const q = APP_KEY ? "?app_key=" + encodeURIComponent(APP_KEY) : "";
  const base = "https://api.tfl.gov.uk/Line/" + LINE;

  const [arrivals, status] = await Promise.all([
    fetch(base + "/Arrivals/" + STATION_ID + q).then((r) => r.json()),
    fetch(base + "/Status" + q).then((r) => r.json())
  ]);

  if (!Array.isArray(arrivals)) throw new Error("unexpected arrivals response");

  arrivals.sort((a, b) => a.timeToStation - b.timeToStation);
  // the headings come from the trains themselves, as on the Pi board: EASTBOUND
  // where the platforms say so, TOWARDS X where they do not
  const cols = columnsFor(arrivals);
  ["A", "B"].forEach((id, i) => {
    const col = cols[i];
    $("dir" + id + "Name").textContent = col ? col.label : "";
    $("dir" + id + "Towards").textContent = col ? col.towards : "";
    $("dir" + id + "Towards").parentElement.style.visibility = col && col.towards ? "" : "hidden";
    paint("col" + id, col ? col.rows : [], !!col);
  });

  const s = worstStatus(status);
  const text = (s && s.statusSeverityDescription) || "Good Service";
  const why = s ? tidyReason(s.reason) : "";
  const el = $("status");
  el.textContent = why ? text + " - " + why : text;
  el.classList.toggle("bad", text.toLowerCase() !== "good service");
  $("tick").style.color = text.toLowerCase() === "good service" ? "" : "var(--time)";

  $("updated").textContent = hhmm(new Date());
  const mode = $("mode");
  mode.textContent = "live";
  mode.classList.add("live");
}

async function refresh() {
  try {
    await load();
  } catch (e) {
    // Offline, rate limited, or running somewhere that blocks the request:
    // keep the sample board on screen and say plainly that it is a sample.
    const mode = $("mode");
    mode.textContent = "sample data";
    mode.classList.remove("live");
  }
}

$("stationName").textContent = STATION;
$("dirAName").textContent = COLUMNS[0].name;
$("dirATowards").textContent = COLUMNS[0].towards;
$("dirBName").textContent = COLUMNS[1].name;
$("dirBTowards").textContent = COLUMNS[1].towards;

showSample();
tickClock();
$("updated").textContent = hhmm(new Date());
setInterval(tickClock, 1000);
refresh();
setInterval(refresh, REFRESH_MS);
</script>
